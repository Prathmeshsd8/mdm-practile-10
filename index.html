<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoPantry - Food Expiry Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans">

  <!-- Header -->
  <header class="bg-emerald-600 text-white shadow-md">
    <div class="max-w-5xl mx-auto px-4 py-6 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">🌱 EcoPantry</h1>
        <p class="text-emerald-100 text-sm">Reduce household food waste by tracking expiration dates</p>
      </div>
      <div class="flex gap-4 text-center">
        <div class="bg-emerald-700/60 px-4 py-2 rounded-lg">
          <span id="stat-total" class="block text-xl font-bold">0</span>
          <span class="text-xs text-emerald-100">Total Items</span>
        </div>
        <div class="bg-amber-500/90 px-4 py-2 rounded-lg">
          <span id="stat-soon" class="block text-xl font-bold">0</span>
          <span class="text-xs text-white">Expiring Soon</span>
        </div>
        <div class="bg-rose-600/90 px-4 py-2 rounded-lg">
          <span id="stat-expired" class="block text-xl font-bold">0</span>
          <span class="text-xs text-white">Expired</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-5xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
    
    <!-- Form Section -->
    <section class="lg:col-span-1">
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-semibold mb-4 text-slate-700">Add Grocery Item</h2>
        <form id="item-form" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1" for="item-name">Item Name</label>
            <input type="text" id="item-name" required placeholder="e.g., Spinach, Milk" 
              class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1" for="item-category">Category</label>
            <select id="item-category" 
              class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
              <option value="Produce">🥦 Produce</option>
              <option value="Dairy">🥛 Dairy</option>
              <option value="Meat">🥩 Meat & Seafood</option>
              <option value="Pantry">🥫 Pantry</option>
              <option value="Other">📦 Other</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1" for="item-date">Expiration Date</label>
            <input type="date" id="item-date" required 
              class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
          </div>

          <button type="submit" 
            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg transition duration-150">
            + Add to Pantry
          </button>
        </form>
      </div>
    </section>

    <!-- Inventory List Section -->
    <section class="lg:col-span-2 space-y-4">
      <!-- Controls -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col sm:flex-row gap-3 justify-between items-center">
        <div class="flex gap-2 w-full sm:w-auto overflow-x-auto pb-1 sm:pb-0">
          <button data-filter="all" class="filter-btn bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium">All</button>
          <button data-filter="soon" class="filter-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-sm font-medium">Expiring Soon</button>
          <button data-filter="expired" class="filter-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-sm font-medium">Expired</button>
        </div>
        <input type="text" id="search-input" placeholder="Search items..." 
          class="w-full sm:w-56 px-3 py-1.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
      </div>

      <!-- Items Container -->
      <div id="items-list" class="space-y-3"></div>
    </section>

  </main>

  <script>
    // State Management
    let items = JSON.parse(localStorage.getItem('ecopantry_items')) || [
      { id: 1, name: 'Greek Yogurt', category: 'Dairy', expiry: getOffsetDate(2) },
      { id: 2, name: 'Fresh Spinach', category: 'Produce', expiry: getOffsetDate(-1) },
      { id: 3, name: 'Almond Milk', category: 'Dairy', expiry: getOffsetDate(10) }
    ];
    let currentFilter = 'all';
    let searchQuery = '';

    function getOffsetDate(days) {
      const d = new Date();
      d.setDate(d.getDate() + days);
      return d.toISOString().split('T')[0];
    }

    // DOM Elements
    const form = document.getElementById('item-form');
    const itemsList = document.getElementById('items-list');
    const searchInput = document.getElementById('search-input');
    const filterButtons = document.querySelectorAll('.filter-btn');

    // Calculate days remaining
    function getDaysRemaining(expiryDate) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const target = new Date(expiryDate + 'T00:00:00');
      const diffTime = target - today;
      return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    }

    // Save & Render
    function saveAndRender() {
      localStorage.setItem('ecopantry_items', JSON.stringify(items));
      renderItems();
      updateStats();
    }

    function updateStats() {
      let soon = 0;
      let expired = 0;
      items.forEach(item => {
        const days = getDaysRemaining(item.expiry);
        if (days < 0) expired++;
        else if (days <= 3) soon++;
      });

      document.getElementById('stat-total').textContent = items.length;
      document.getElementById('stat-soon').textContent = soon;
      document.getElementById('stat-expired').textContent = expired;
    }

    function renderItems() {
      itemsList.innerHTML = '';

      const filtered = items
        .filter(item => {
          const days = getDaysRemaining(item.expiry);
          if (currentFilter === 'soon') return days >= 0 && days <= 3;
          if (currentFilter === 'expired') return days < 0;
          return true;
        })
        .filter(item => item.name.toLowerCase().includes(searchQuery.toLowerCase()))
        .sort((a, b) => new Date(a.expiry) - new Date(b.expiry));

      if (filtered.length === 0) {
        itemsList.innerHTML = `
          <div class="bg-white p-8 rounded-xl border border-slate-200 text-center text-slate-400">
            No matching items found in your pantry.
          </div>`;
        return;
      }

      filtered.forEach(item => {
        const days = getDaysRemaining(item.expiry);
        let badgeClass = 'bg-emerald-100 text-emerald-800';
        let statusText = `${days} days left`;

        if (days < 0) {
          badgeClass = 'bg-rose-100 text-rose-800';
          statusText = `Expired ${Math.abs(days)}d ago`;
        } else if (days === 0) {
          badgeClass = 'bg-amber-100 text-amber-800';
          statusText = 'Expires today';
        } else if (days <= 3) {
          badgeClass = 'bg-amber-100 text-amber-800';
          statusText = `${days} day(s) left`;
        }

        const card = document.createElement('div');
        card.className = 'bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center transition hover:shadow-md';
        card.innerHTML = `
          <div>
            <div class="flex items-center gap-2">
              <h3 class="font-semibold text-slate-800">${item.name}</h3>
              <span class="text-xs px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">${item.category}</span>
            </div>
            <p class="text-xs text-slate-400 mt-1">Expires: ${item.expiry}</p>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${badgeClass}">
              ${statusText}
            </span>
            <button onclick="deleteItem(${item.id})" title="Mark as used / Delete"
              class="text-slate-400 hover:text-rose-600 transition p-1">
              ✕
            </button>
          </div>
        `;
        itemsList.appendChild(card);
      });
    }

    // Event Listeners
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('item-name').value.trim();
      const category = document.getElementById('item-category').value;
      const expiry = document.getElementById('item-date').value;

      if (!name || !expiry) return;

      items.push({ id: Date.now(), name, category, expiry });
      form.reset();
      saveAndRender();
    });

    window.deleteItem = function(id) {
      items = items.filter(item => item.id !== id);
      saveAndRender();
    };

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderItems();
    });

    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => {
          b.className = 'filter-btn bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg text-sm font-medium';
        });
        btn.className = 'filter-btn bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium';
        currentFilter = btn.dataset.filter;
        renderItems();
      });
    });

    // Initialize
    saveAndRender();
  </script>
</body>
</html>
